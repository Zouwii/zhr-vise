<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>王慧520福利日</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="lottery" aria-label="王慧520福利日抽奖">
        <p class="eyebrow">520 福利限定</p>
        <h1>王慧520福利日</h1>
        <p class="subtitle">抽取节日红包</p>

        <div class="red-packet" id="packet">
          <div class="packet-top"></div>
          <div class="packet-body">
            <span class="packet-label">￥</span>
            <strong id="amount">0.00</strong>
          </div>
        </div>

        <button class="draw-button" id="drawButton" type="button">
          开始抽奖
        </button>

        <p class="hint" id="hint">红包金额将在 0.00 到 200.00 之间随机生成</p>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
